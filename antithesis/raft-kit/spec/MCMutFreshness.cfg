SPECIFICATION QuietSpec
CONSTANTS
  Server = {s1, s2, s3}
  Values = {v1}
  Nil = Nil
  MaxTerm = 3
  MaxLog = 2
  MaxBatch = 1
  MaxMsgs = 7
  UpToDate <- NoFreshnessCheck
CONSTRAINT Bounded
SYMMETRY Symmetry
INVARIANTS
  ElectionSafety
  OneVotePerTerm
  LogMatching
  StateMachineSafety
  LeaderCompleteness
  CommittedEntriesPreserved
  LeaderLogIsLed
  RequestsFromLed
  ConfirmedWithinLog
PROPERTIES
  TermMonotonic
CHECK_DEADLOCK FALSE
