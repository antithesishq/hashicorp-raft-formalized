[package]
name = "driver"
version = "0.1.0"
edition = "2021"

[dependencies]
hegeltest = { version = "0.52.1", features = ["static-engine"] }
antithesis_sdk = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"] }
libc = "0.2"


[profile.release]
debug = 1
